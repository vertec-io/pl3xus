[package]
name = "robot_hmi_plugins"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["ecs", "server"]

# ECS feature - enables Bevy Component derives and ECS systems
ecs = [
    "dep:bevy",
    "dep:pl3xus_sync",
    "dep:pl3xus_macros",
    "dep:pl3xus",
    "dep:robot_hmi_core",
    "dep:robot_hmi_fanuc",
    "robot_hmi_core/ecs",
    "robot_hmi_fanuc/ecs",
    "robot_hmi_execution/ecs",
    "robot_hmi_programs/ecs",
]

# Server feature - enables server-only functionality (driver, database, tokio)
server = [
    "ecs",
    "fanuc_rmi/driver",
    "fanuc_rmi/logging",
    "dep:tokio",
    "dep:rusqlite",
    "dep:anyhow",
    "dep:pl3xus_websockets",
    "dep:pl3xus_async",
    "robot_hmi_core/server",
    "robot_hmi_fanuc/server",
    "robot_hmi_execution/server",
    "robot_hmi_programs/server",
]

# Duet feature - enables Duet extruder support
duet = [
    "server",
    "dep:robot_hmi_duet",
    "robot_hmi_duet/server",
]

# Stores feature - enables reactive stores for client-side fine-grained reactivity
stores = [
    "dep:reactive_stores",
    "dep:robot_hmi_core",
    "dep:robot_hmi_fanuc",
    "robot_hmi_core/stores",
    "robot_hmi_fanuc/stores",
    "robot_hmi_execution/stores",
    "robot_hmi_programs/stores",
]

[dependencies]
# Always available
serde.workspace = true
cfg-if.workspace = true

# Fanuc RMI types - always available with DTO feature
# Server feature enables driver/logging features
fanuc_rmi = { workspace = true, features = ["DTO"], default-features = false }

# Robot-agnostic coordinate types
robot_hmi_robotics.workspace = true

# Always-available types (pure data types, no ECS/server deps)
pl3xus_common.workspace = true
robot_hmi_execution = { workspace = true, default-features = false }
robot_hmi_programs = { workspace = true, default-features = false }

# ECS feature dependencies
bevy = { workspace = true, features = ["multi_threaded", "bevy_log"], optional = true }
pl3xus = { workspace = true, optional = true }
pl3xus_sync = { workspace = true, features = ["runtime"], optional = true }
pl3xus_macros = { workspace = true, optional = true }

# Server feature dependencies
tokio = { workspace = true, optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
anyhow = { version = "1.0", optional = true }
pl3xus_websockets = { workspace = true, optional = true }
pl3xus_async = { workspace = true, optional = true }

# Plugin crates (feature-gated, default-features = false to avoid pulling in server deps for WASM)
robot_hmi_core = { workspace = true, optional = true, default-features = false }
robot_hmi_fanuc = { workspace = true, optional = true, default-features = false }
robot_hmi_duet = { workspace = true, optional = true, default-features = false }

# Stores feature dependencies (client-side)
reactive_stores = { workspace = true, optional = true }

